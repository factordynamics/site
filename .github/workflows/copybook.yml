name: Copybook ingest tests

# The data refresh runs in refcell/gust (.github/workflows/copybook-data.yml),
# which checks out copybook/ from this repo.
on:
  push:
    paths:
      - "copybook/**"
      - ".github/workflows/copybook.yml"
  pull_request:
    paths:
      - "copybook/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        working-directory: copybook
