name: Copybook site keepalive

# GitHub's scheduler drops most of copybook-pages.yml's 10-minute runs (four ran on Nov 10), so the
# site lagged the data by hours. Like refcell/gust's copybook-keepalive.yml, this uses GITHUB_TOKEN
# alone (workflow_dispatch is the documented exception it may trigger): one job loops for about
# 5 hours and every 5 minutes dispatches a Pages build when gust has a data commit
# newer than the start of the last successful site build and no Pages run is
# queued or running, then dispatches its successor. The concurrency group keeps one chain; the
# cron restarts it if it dies.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: copybook-site-keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rebuild the site within 10 minutes of new data
        run: |
          start=$SECONDS
          while [ $((SECONDS - start)) -lt 18000 ]; do
            # Newest data commit in gust against the start of the last successful site build. (index.json's
            # generated_at alone misses a full run that publishes all-filer files on a newer curated snapshot.)
            data=$(gh api "repos/refcell/gust/commits?path=public/copybook/data&per_page=1" -q '.[0].commit.committer.date' || true)
            built=$(gh run list --workflow copybook-pages.yml -L 20 --json conclusion,createdAt -q '[.[] | select(.conclusion == "success")][0].createdAt' || true)
            busy=$(gh run list --workflow copybook-pages.yml -L 10 --json status -q '[.[] | select(.status != "completed")] | length' || echo 1)
            if [ -n "$data" ] && [[ "$data" > "${built:-0}" ]] && [ "${busy:-1}" = 0 ]; then
              echo "$(date -u +%T) data commit $data, last build $built: dispatch"
              gh workflow run copybook-pages.yml --ref main || echo "::warning::dispatch failed"
            else
              echo "$(date -u +%T) data commit $data, last build $built, pages runs going $busy: skip"
            fi
            sleep 300
          done
          gh workflow run copybook-site-keepalive.yml --ref main
