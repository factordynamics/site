name: Copybook Pages

# Builds copybook/web for https://copybook.factordynamics.com/ and deploys it with GitHub Pages.
# Data stays in refcell/gust (refreshed by its copybook-data.yml) and is read cross-origin.
# The schedule rebuilds the sitemap and per-investor pages after each data refresh. In the November
# filing wave it also runs 7 minutes after each curated refresh (refcell/gust copybook-data.yml runs
# at :08/:28/:48) so a new 13F gets its filing card within about half an hour, and skips the build when
# the published data hasn't changed since the live deploy.
on:
  push:
    branches: [main]
    paths:
      - "copybook/web/**"
      - ".github/workflows/copybook-pages.yml"
  schedule:
    - cron: "40 */3 * * *"
    - cron: "15,35,55 * 9-17 11 *"
  workflow_dispatch:
    inputs:
      force_data:
        description: Publish even if the data is older than the live site's
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: copybook-pages
  cancel-in-progress: false

env:
  COPYBOOK_BASE: /
  VITE_SITE: https://copybook.factordynamics.com/
  VITE_DATA_BASE: https://refcell.github.io/gust/copybook/data/

jobs:
  # Filing-wave runs only: compare the data's generated_at with the one the live site was built from.
  fresh:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.cmp.outputs.skip }}
    steps:
      - id: cmp
        run: |
          if [ "${{ github.event.schedule }}" != "15,35,55 * 9-17 11 *" ]; then exit 0; fi
          data=$(curl -fsS "${VITE_DATA_BASE}index.json?t=$(date +%s)" | jq -r .generated_at || true)
          live=$(curl -fsS "${VITE_SITE}d/coverage.json?t=$(date +%s)" | jq -r .generated_at || true)
          echo "data ${data}, live ${live}"
          if [ -n "$data" ] && [ "$data" = "$live" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: fresh
    if: needs.fresh.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    defaults:
      run:
        working-directory: copybook/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: copybook/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/stocks.mjs dist "${VITE_DATA_BASE}"
        env:
          FLOW_FULL: ${{ runner.temp }}/flow-full.json
      # Members' Flow lists (every fund on each side) for the API's GET /flow, sent with this
      # workflow's OIDC token. A failed upload leaves the last one in place and doesn't block the deploy.
      - name: Publish full Flow to the API
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=copybook-api" | jq -r .value)
          curl -fsS -X PUT -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            --data-binary @"${RUNNER_TEMP}/flow-full.json" https://gene.tail70ba3.ts.net/copybook/ingest/flow/full.json
          echo
      - run: node scripts/cards.mjs dist "${VITE_DATA_BASE}"
      - run: node scripts/postbuild.mjs "${VITE_DATA_BASE}index.json"
      - run: node scripts/sitemap.mjs dist "${VITE_DATA_BASE}index.json"
      # Share tags: one description per page, twitter matching og. Fails the deploy otherwise.
      - run: node scripts/checkmeta.mjs dist
      # Never publish an older data snapshot than the live one (the data repo can briefly go backwards).
      - run: node scripts/freshgate.mjs dist
        env:
          FORCE_DATA: ${{ inputs.force_data && '1' || '' }}
      # Skip the deploy (without failing) until Pages is enabled in the repo settings.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled for this repo yet; build checked, deploy skipped."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: copybook/web/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
