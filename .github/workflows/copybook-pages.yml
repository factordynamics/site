name: Copybook Pages

# Builds copybook/web for https://copybook.factordynamics.com/ and deploys it with GitHub Pages.
# Data stays in refcell/gust (refreshed by its copybook-data.yml) and is read cross-origin.
# The schedule is what keeps the site fresh (no cross-repo dispatch token): every 10 minutes in each
# filing season's last two and a half weeks (the 1st to the 17th of Feb, May, Aug and Nov, which covers
# every deadline, Feb 16 2027 included), hourly otherwise. The build derives the season tracker, recap,
# flow and stock pages (d/) from the data host, and writes titles and share cards. The 10-minute runs
# skip the build when the published data hasn't changed since the live deploy. GitHub may start
# scheduled runs a few minutes late.
on:
  push:
    branches: [main]
    paths:
      - "copybook/web/**"
      - ".github/workflows/copybook-pages.yml"
  schedule:
    - cron: "*/10 * 1-17 2,5,8,11 *"
    - cron: "5 * 18-31 * *"
    - cron: "5 * 1-17 1,3,4,6,7,9,10,12 *"
  workflow_dispatch:
    inputs:
      force_data:
        description: Publish even if the data is older than the live site's
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: copybook-pages
  cancel-in-progress: false

env:
  COPYBOOK_BASE: /
  VITE_SITE: https://copybook.factordynamics.com/
  VITE_DATA_BASE: https://refcell.github.io/gust/copybook/data/
  # Deploy freeze, Thu Nov 12 to Mon Nov 16 on EDGAR weekdays, 11:00-03:00 UTC (6am-10pm ET): runs in the
  # window still rebuild the data, but from the copybook/web code on main when the window opened, so
  # filing-day pages aren't caught by a front-end change. A P0 fix ships anyway: start its commit subject
  # with [P0] (after a local build and boot check), and the freeze builds from it.
  FREEZE_DAYS: "2026-11-12 2026-11-13 2026-11-16"

jobs:
  # 10-minute runs only: compare the data's generated_at with the one the live site was built from.
  fresh:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.cmp.outputs.skip }}
    steps:
      - id: cmp
        run: |
          if [ "${{ github.event.schedule }}" != "*/10 * 1-17 2,5,8,11 *" ]; then exit 0; fi
          data=$(curl -fsS "${VITE_DATA_BASE}index.json?t=$(date +%s)" | jq -r .generated_at || true)
          live=$(curl -fsS "${VITE_SITE}d/coverage.json?t=$(date +%s)" | jq -r .generated_at || true)
          echo "data ${data}, live ${live}"
          if [ -n "$data" ] && [ "$data" = "$live" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: fresh
    if: needs.fresh.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    defaults:
      run:
        working-directory: copybook/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy freeze
        working-directory: .
        run: |
          now=$(date -u +%s); start=
          for d in ${FREEZE_DAYS}; do
            s=$(date -u -d "${d}T11:00:00Z" +%s)
            if [ "$now" -ge "$s" ] && [ "$now" -lt $((s + 16 * 3600)) ]; then start="${d}T11:00:00Z"; fi
          done
          [ -n "$start" ] || exit 0
          # Only a commit whose subject starts with [P0] (as gene's deployer counts it), not one that mentions it.
          p0=$(git log --since="$start" --format='%H %s' HEAD -- copybook/web | awk '$2 ~ /^\[P0\]/ { print $1; exit }')
          ref=${p0:-$(git rev-list -1 --before="$start" HEAD)}
          echo "::notice::Deploy freeze (window from ${start}): copybook/web from ${ref:0:7}${p0:+ (P0)}"
          rm -rf copybook/web && git checkout "$ref" -- copybook/web
          echo "COPYBOOK_BUILD_SHA=$(git log -1 --format=%H "$ref" -- copybook/web)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: copybook/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/stocks.mjs dist "${VITE_DATA_BASE}"
        env:
          FLOW_FULL: ${{ runner.temp }}/flow-full.json
      # Members' Flow lists (every fund on each side) for the API's GET /flow, sent with this
      # workflow's OIDC token. A failed upload leaves the last one in place and doesn't block the deploy.
      - name: Publish full Flow to the API
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=copybook-api" | jq -r .value)
          curl -fsS -X PUT -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            --data-binary @"${RUNNER_TEMP}/flow-full.json" https://gene.tail70ba3.ts.net/copybook/ingest/flow/full.json
          echo
      - run: node scripts/cards.mjs dist "${VITE_DATA_BASE}"
      - run: node scripts/postbuild.mjs "${VITE_DATA_BASE}index.json"
      - run: node scripts/sitemap.mjs dist "${VITE_DATA_BASE}index.json"
      # Share tags: one description per page, twitter matching og. Fails the deploy otherwise.
      - run: node scripts/checkmeta.mjs dist
      # Never publish an older data snapshot than the live one (the data repo can briefly go backwards).
      - run: node scripts/freshgate.mjs dist
        env:
          FORCE_DATA: ${{ inputs.force_data && '1' || '' }}
      # Browser smoke test on every deploy, P0 fixes and freeze builds included: current stable Chrome opens
      # the built site, clicks home -> Season, Security, Pricing, a fund page, then Back, and a blank page or
      # an uncaught page error fails the deploy (Nov 11: a link click blanked the site on Chrome 157).
      # The runner image ships Google Chrome; install it only when missing, so a down apt mirror can't block a deploy.
      - name: Chrome for the smoke test
        run: |
          [ -x /opt/google/chrome/chrome ] || npx playwright install --with-deps --force chrome
          /opt/google/chrome/chrome --version
      - run: node scripts/smoke.mjs dist
      # Skip the deploy (without failing) until Pages is enabled in the repo settings.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled for this repo yet; build checked, deploy skipped."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: copybook/web/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
