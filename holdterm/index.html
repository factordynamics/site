<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      if (location.hostname === 'holdterm.pages.dev') location.replace('https://holdterm.factordynamics.com' + location.pathname + location.search)
      try {
        if (localStorage.getItem('holdterm-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name=theme-color]').content = '#151b23'
        }
      } catch {}
    </script>
    <title>Holdterm · What long-term investors buy and sell</title>
    <meta name="description" content="See what concentrated, long-term investors own, buy and sell, from their 13F, 13D/G and Form 4 filings with the SEC. Free to read, no ads. Alerts for $3 a month." />
    <link rel="canonical" href="https://holdterm.factordynamics.com/" />
    <meta property="og:url" content="https://holdterm.factordynamics.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- SEC data hosts: connect early. The section pages wait on the investor index, so start it before the app script;
         fund and stock pages render from their own files first, so they leave the bandwidth to those. -->
    <link rel="preconnect" href="https://refcell.github.io" crossorigin="anonymous" />
    <link rel="preconnect" href="https://copybook.factordynamics.com" crossorigin="anonymous" />
    <script>
      var pre = function (f) {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'fetch'
        l.crossOrigin = 'anonymous'
        l.href = 'https://refcell.github.io/gust/copybook/data/' + f
        document.head.appendChild(l)
      }
      if (/^\/(funds|flows|consensus|filings)?\/?$/.test(location.pathname)) pre('index.json')
      // Pages built from every investor's 13F: all the books in one file.
      if (/^\/(funds|flows|consensus)\/?$/.test(location.pathname)) pre('books.json')
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Holdterm" />
    <meta property="og:title" content="Holdterm · What long-term investors buy and sell" />
    <meta property="og:description" content="See what concentrated, long-term investors own, buy and sell, from their 13F, 13D/G and Form 4 filings with the SEC. Free to read, no ads." />
    <meta property="og:image" content="https://holdterm.factordynamics.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://holdterm.factordynamics.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
