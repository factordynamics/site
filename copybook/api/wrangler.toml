name = "copybook-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
account_id = "967e13dd88bb23b24662e62cbb6fd84f"

# KV namespace copybook-api-DB.
[[kv_namespaces]]
binding = "DB"
id = "830e2b3035554fa2865bc523dfcbf2fb"

# Private paid history (h/{slug}/{quarter}.json|csv), uploaded by the data workflow via PUT /ingest/.
[[r2_buckets]]
binding = "HIST"
bucket_name = "copybook-history"

# The minute EDGAR poll runs here (primary poller). gene serves members and /v1 and is the backup poller: it polls
# only when this cron has been silent for 10 minutes. KV syncs both ways through R2 and every send is claimed
# once (SYNC = "on", src/failover.ts). See HOSTING.md.
[triggers]
crons = ["* * * * *"]

[vars]
CF_ACCOUNT_ID = "967e13dd88bb23b24662e62cbb6fd84f"
PUBLIC_BUCKET = "copybook-public"
PUBLIC_URL = "https://pub-c691ec38c5cd4db6acb8e6bfef337500.r2.dev/"
SITE_URL = "https://copybook.factordynamics.com/"
DATA_URL = "https://refcell.github.io/gust/copybook/data/"
ALLOWED_ORIGINS = "https://copybook.factordynamics.com,https://refcell.github.io,https://holdterm.pages.dev,https://holdterm.factordynamics.com"
# Holdterm, a separate brand on this Worker: its site and billing portal.
HOLDTERM_SITE_URL = "https://holdterm.factordynamics.com/"
HOLDTERM_PORTAL_CONFIGURATION = "bpc_1UZeGADSKGGzRqYZ2TuZE74Y"
EMAIL_FROM = "Copybook <copybook@factordynamics.com>"
# Our inbox (forwards to the owner): reply-to on every email, and where fund/support/delete requests go.
CONTACT_EMAIL = "hello@factordynamics.com"
# Links in email (resume, unsubscribe, feeds, CSV) go straight to gene, which serves members.
API_URL = "https://gene.tail70ba3.ts.net/copybook/"
SYNC = "on"
# bpc_... printed by scripts/stripe-setup.mjs (portal_configuration).
# GitHub Actions OIDC workflow_ref allowed to PUT /ingest/.
INGEST_WORKFLOW = "refcell/gust/.github/workflows/copybook-data.yml@refs/heads/main"
PAGES_WORKFLOW = "factordynamics/site/.github/workflows/copybook-pages.yml@refs/heads/main"
PRECOMPUTE_WORKFLOW = "factordynamics/site/.github/workflows/copybook-api-precompute.yml@refs/heads/main"
PORTAL_CONFIGURATION = "bpc_1UZHZgDSKGGzRqYZbvRwUas4"

# Secrets (npx wrangler secret put NAME): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SESSION_SECRET, RESEND_API_KEY

# Per-API-key rate limits and usage counters (Copy Pro), one SQLite-backed Durable Object per key.
[[durable_objects.bindings]]
name = "METER"
class_name = "KeyMeter"

# Each member's follows, written one change at a time (KV has no compare-and-swap).
[[durable_objects.bindings]]
name = "FOLLOWS"
class_name = "MemberFollows"

[[migrations]]
tag = "v1-key-meter"
new_sqlite_classes = ["KeyMeter"]

[[migrations]]
tag = "v2-member-follows"
new_sqlite_classes = ["MemberFollows"]
